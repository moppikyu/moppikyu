name: generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # regenerate every 12 hours
  push:
    branches:
      - main
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: moppikyu
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=D9455F&color_dots=121212,1f2937,3DA9A0,D9455F,ff6b81
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push generated svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
